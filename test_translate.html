<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Translate Test</title>
</head>
<body>
  <h1>Hello World</h1>
  <p>This is a test of the translation widget.</p>
  <div id="google_translate_element"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'vi,en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
